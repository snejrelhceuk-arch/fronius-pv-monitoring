[project]
name = "pv-system"
version = "3.0.0"
description = "PV-Monitoring & Automation für Fronius GEN24 + BYD HVS"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
# Bewusst minimale Projektmetadaten fuer lokale Imports/Tools; Runtime startet
# weiterhin die Skripte/Module direkt aus dem Workspace.
py-modules = ["config", "db_utils", "db_init", "fritzdect_read", "fronius_api",
              "gunicorn_config", "host_role", "solar_cache", "solar_forecast",
              "solar_geometry", "solar_openmeteo", "statistics_corrections",
              "wattpilot_api", "web_api", "wp_modbus"]

[tool.setuptools.packages.find]
include = ["analysis", "automation*", "collector*", "diagnos*", "nq*",
           "routes*", "steuerbox*", "tools.pv_config*", "wp_bridge*"]
