# ════════════════════════════════════════════════════════════════════════════
# Heizungssteuerung-Komplett — VERBESSERTE KOPIE (Review-Vorschlag)
# ════════════════════════════════════════════════════════════════════════════
#
# Diese Datei ist ein REVIEW-Vorschlag zu HA-Heizung.yaml. Sie wird NICHT vom
# PV-System ausgeführt (Rolle C steuert die FBH-Steckdose separat, s. u.) und
# dient nur als verbesserte Vorlage zum Übernehmen in HomeAssistant.
#
# ── AUDIT der bisherigen Automation (HA-Heizung.yaml) ───────────────────────
# Bewertung: funktional korrekt, aber drei Robustheits-Schwächen:
#
# 1) KEINE HYSTERESE: Jeder Raum schaltet EIN bei `below: 22.5` und AUS bei
#    `above: 22.5` (bzw. 22.4). Bei Sensorrauschen um den Schwellwert führt das
#    zu schnellem EIN/AUS-Takten der Shelly-Relais (Relais-Chatter, Verschleiß).
#    → FIX: Totband. EIN unter T-0.2, AUS über T+0.2 (0.4 K Deadband).
#
# 2) KEINE ENTPRELLUNG: `numeric_state` reagiert auf einen einzelnen Messwert.
#    Ein kurzer Spike schaltet sofort.
#    → FIX: `for: minutes: 2` — Bedingung muss 2 Min stabil anliegen.
#
# 3) mode: single + time_pattern /3 min: Falls ein Lauf länger als 3 min dauert
#    (träge Shellys), werden Trigger verworfen.
#    → FIX: `mode: queued` (max 3) — Läufe gehen nicht verloren.
#
# Weitere Empfehlungen (NICHT umgesetzt, da nur mit HA-Zugriff sicher machbar):
#  - Targets konsistent auf `entity_id` statt `device_id` umstellen. device_id
#    bricht beim Neupairing eines Geräts; entity_id ist stabil/lesbar.
#  - Die 6 nahezu identischen Raum-Blöcke ließen sich per Skript/Blueprint mit
#    Variablen stark verkürzen (DRY). Hier bewusst explizit gelassen.
#
# ── KOEXISTENZ mit der PV-System-Nachtschaltung (WICHTIG) ───────────────────
# Das PV-System (Rolle C, RegelFussbodenheizungNacht) schaltet die FBH-Steckdose
# (Fritz!DECT, AIN 11657 0600249) NEU minimal 03:00 EIN / 05:00 AUS — als
# Regelmäßigkeit für den SOMMER, wenn DIESE HA-Automation deaktiviert ist.
#
# Beide Steuerungen greifen auf DASSELBE physische Relais zu. Empfehlung:
#  - SOMMER: HA-Automation AUS (wie bisher) → PV-System übernimmt die Nacht.
#  - WINTER: HA-Automation AN → sie verwaltet die FBH ohnehin (Nachtfenster
#    03:00–05:30 unten). Dann im PV-System den Regelkreis `fussbodenheizung`
#    in config/soc_param_matrix.json auf `"aktiv": false` setzen, damit das
#    PV-AUS um 05:00 nicht gegen das HA-Nachtfenster (bis 05:30) arbeitet.
#    (Beide sind flankenbasiert → höchstens 1 zusätzlicher Schaltzyklus, kein
#     Dauer-Oszillieren. Trotzdem sauberer, je Saison nur eine Quelle aktiv.)
#
# ════════════════════════════════════════════════════════════════════════════

alias: Heizungssteuerung-Komplett (verbessert)
description: >-
  Zentrale Heizungssteuerung für alle Räume, Pumpe und Dach.
  Review-Kopie mit Hysterese, Entprellung und queued-Mode.
triggers:
  - trigger: time_pattern
    minutes: /3
  - trigger: state
    entity_id: switch.heizungdachboden
  - trigger: state
    entity_id: switch.fussbodenheizung
  - trigger: time
    at: "03:00:00"
  - trigger: time
    at: "05:30:00"
conditions: []
actions:
  # ── Küche ────────────────────────────────────────────────────────────────
  - choose:
      - conditions:
          - condition: numeric_state
            entity_id: sensor.tempkue_temperatur
            below: 22.3            # EIN-Schwelle (Soll 22.5 − 0.2 Hysterese)
            for:
              minutes: 2           # Entprellung gegen Spikes
          - condition: state
            entity_id: switch.shellypro4pm_kuche
            state: "off"
        sequence:
          - action: switch.turn_on
            target:
              device_id: 13cb54d8fc840bb44b799146d71d29ad
      - conditions:
          - condition: numeric_state
            entity_id: sensor.tempkue_temperatur
            above: 22.7            # AUS-Schwelle (Soll 22.5 + 0.2 Hysterese)
            for:
              minutes: 2
          - condition: state
            entity_id: switch.shellypro4pm_kuche
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              device_id: 13cb54d8fc840bb44b799146d71d29ad
  # ── SO-Zimmer ────────────────────────────────────────────────────────────
  - choose:
      - conditions:
          - condition: numeric_state
            entity_id: sensor.shellyhtg3_e4b32331f7cc_temperatur
            below: 22.3
            for:
              minutes: 2
          - condition: state
            entity_id: switch.shellypro4pm_so_zimmer
            state: "off"
        sequence:
          - action: switch.turn_on
            target:
              device_id: 8a404f2e4ed16b3279147dbcd9dd2619
      - conditions:
          - condition: numeric_state
            entity_id: sensor.shellyhtg3_e4b32331f7cc_temperatur
            above: 22.7
            for:
              minutes: 2
          - condition: state
            entity_id: switch.shellypro4pm_so_zimmer
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              device_id: 8a404f2e4ed16b3279147dbcd9dd2619
  # ── NO-Zimmer ────────────────────────────────────────────────────────────
  - choose:
      - conditions:
          - condition: numeric_state
            entity_id: sensor.tempno_temperatur
            below: 22.3
            for:
              minutes: 2
          - condition: state
            entity_id: switch.shellypro4pm_no_zimmer
            state: "off"
        sequence:
          - action: switch.turn_on
            target:
              device_id: f99cb4e51c14b515a551587cde30cfec
      - conditions:
          - condition: numeric_state
            entity_id: sensor.tempno_temperatur
            above: 22.7
            for:
              minutes: 2
          - condition: state
            entity_id: switch.shellypro4pm_no_zimmer
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              device_id: f99cb4e51c14b515a551587cde30cfec
  # ── Maria (4. OG) ────────────────────────────────────────────────────────
  - choose:
      - conditions:
          - condition: numeric_state
            entity_id: sensor.shellyhtg3_e4b3232f8980_temperatur
            below: 22.2            # Soll 22.4 − 0.2
            for:
              minutes: 2
          - condition: state
            entity_id: switch.shelly4og_maria
            state: "off"
        sequence:
          - action: switch.turn_on
            target:
              device_id: 173ab4e12d8a06a86f5f409f37332d46
      - conditions:
          - condition: numeric_state
            entity_id: sensor.shellyhtg3_e4b3232f8980_temperatur
            above: 22.6            # Soll 22.4 + 0.2
            for:
              minutes: 2
          - condition: state
            entity_id: switch.shelly4og_maria
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              device_id: 173ab4e12d8a06a86f5f409f37332d46
  # ── Mama (4. OG) ─────────────────────────────────────────────────────────
  - choose:
      - conditions:
          - condition: numeric_state
            entity_id: sensor.tmpmama_temperatur
            below: 22.2
            for:
              minutes: 2
          - condition: state
            entity_id: switch.shelly4og_mama
            state: "off"
        sequence:
          - action: switch.turn_on
            target:
              device_id: 16d8778957ec426e7f2b2ffced2d1386
      - conditions:
          - condition: numeric_state
            entity_id: sensor.tmpmama_temperatur
            above: 22.6
            for:
              minutes: 2
          - condition: state
            entity_id: switch.shelly4og_mama
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              device_id: 16d8778957ec426e7f2b2ffced2d1386
  # ── Johannes (4. OG) ─────────────────────────────────────────────────────
  - choose:
      - conditions:
          - condition: numeric_state
            entity_id: sensor.tmpjojo_temperatur
            below: 22.2
            for:
              minutes: 2
          - condition: state
            entity_id: switch.shelly4og_johannes
            state: "off"
        sequence:
          - action: switch.turn_on
            target:
              device_id: b8b808bed830c1999b26f1a1c5045151
      - conditions:
          - condition: numeric_state
            entity_id: sensor.tmpjojo_temperatur
            above: 22.6
            for:
              minutes: 2
          - condition: state
            entity_id: switch.shelly4og_johannes
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              device_id: b8b808bed830c1999b26f1a1c5045151
  # ── Fußbodenheizung (Pumpe) ──────────────────────────────────────────────
  # Logik unverändert zur Vorlage (De-Morgan-konsistent): EIN sobald ein Raum
  # heizt ODER Dachheizung aus ODER Nachtfenster 03:00–05:30; AUS nur wenn alle
  # Räume aus UND Dachheizung an UND außerhalb des Nachtfensters.
  # Hinweis: Im SOMMER (diese Automation deaktiviert) übernimmt das PV-System
  # die Nachtschaltung. Siehe Koexistenz-Hinweis im Kopf.
  - choose:
      - conditions:
          - condition: or
            conditions:
              - condition: state
                entity_id: switch.shellypro4pm_kuche
                state: "on"
              - condition: state
                entity_id: switch.shellypro4pm_so_zimmer
                state: "on"
              - condition: state
                entity_id: switch.shellypro4pm_no_zimmer
                state: "on"
              - condition: state
                entity_id: switch.shelly4og_maria
                state: "on"
              - condition: state
                entity_id: switch.shelly4og_mama
                state: "on"
              - condition: state
                entity_id: switch.shelly4og_johannes
                state: "on"
              - condition: state
                entity_id: switch.heizungdachboden
                state: "off"
              - condition: time
                after: "03:00:00"
                before: "05:30:00"
          - condition: state
            entity_id: switch.fussbodenheizung
            state: "off"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.fussbodenheizung
      - conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: switch.shellypro4pm_kuche
                state: "off"
              - condition: state
                entity_id: switch.shellypro4pm_so_zimmer
                state: "off"
              - condition: state
                entity_id: switch.shellypro4pm_no_zimmer
                state: "off"
              - condition: state
                entity_id: switch.shelly4og_maria
                state: "off"
              - condition: state
                entity_id: switch.shelly4og_mama
                state: "off"
              - condition: state
                entity_id: switch.shelly4og_johannes
                state: "off"
              - condition: state
                entity_id: switch.heizungdachboden
                state: "on"
          - condition: state
            entity_id: switch.fussbodenheizung
            state: "on"
          - condition: not
            conditions:
              - condition: time
                after: "03:00:00"
                before: "05:30:00"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.fussbodenheizung
# mode: queued — verlorene Trigger vermeiden, wenn ein Lauf >3 min dauert.
mode: queued
max: 3
