# PV-System Steuerbox — HTTPS Reverse-Proxy (Rolle E, nur Primary)
# Externer Port 11933 (LAN, UFW-gesichert) -> intern 127.0.0.1:11934 (Flask)
# Install: scripts/install_steuerbox_proxy.sh
server {
    listen 11933 ssl;
    server_name steuerbox.pv.local _;

    ssl_certificate     /etc/ssl/certs/steuerbox.crt;
    ssl_certificate_key /etc/ssl/private/steuerbox.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Nur LAN-Zugriffe (zusaetzlich zu UFW-Absicherung)
    # __LAN_CIDR__ wird beim Install (install_steuerbox_proxy.sh) durch das
    # reale LAN-Subnetz ersetzt (aus PV_LAN_CIDR bzw. abgeleitet aus hostname -I).
    allow __LAN_CIDR__;
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass         http://127.0.0.1:11934;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
