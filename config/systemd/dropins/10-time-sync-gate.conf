# Zeit-Sync-Gate (drop-in) — verhindert Datenaufzeichnung mit falscher Uhrzeit.
#
# Hintergrund: Die Pi5/Pi4 haben keine gepufferte RTC. Nach einem Stromausfall
# steht die Uhr beim Boot auf 1970 und wird von systemd-timesyncd zunaechst
# rueckwaerts auf den letzten gespeicherten Stand gesetzt. Ohne dieses Gate
# schreiben die Collector Messdaten mit dieser FALSCHEN Uhrzeit, bis NTP (Internet)
# irgendwann vorwaerts springt — es entstehen zeitverschobene Daten und eine
# versteckte Luecke (siehe doc/audit/2026-09-08-blackout.md).
#
# Wirkung: Der Dienst startet erst, wenn die Systemuhr NTP-synchronisiert ist
# (time-sync.target, aktiviert ueber systemd-time-wait-sync.service).
# Grundsatz: lieber eine SAUBERE Luecke als falsch datierte Daten
# ("erstmal die Zaehler bemuehen, nicht auf Verdacht befuellen").
#
# Verwaltet von scripts/install_time_sync_gate.sh (idempotent, role-agnostisch).
[Unit]
Wants=time-sync.target
After=time-sync.target
