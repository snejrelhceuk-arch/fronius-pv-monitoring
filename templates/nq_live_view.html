<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v={{ favicon_version }}">
    <title>Netzqualität Live (PAC4200) - PV-System</title>
    <script src="/static/js/nav-context.js"></script>
    <script src="/static/js/nav-ui.js"></script>
    <link rel="stylesheet" href="/static/css/nav-ui.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0; min-height: 100vh;
        }
        .top-nav {
            display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
            padding: 8px 16px; background: rgba(15,23,42,0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .top-nav .title { font-size: 14px; font-weight: 700; letter-spacing:.3px; }
        .top-nav a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 13px;
            padding: 6px 12px; border-radius: 6px; transition: all .2s; }
        .top-nav a:hover { color:#fff; background: rgba(255,255,255,0.1); }
        .status { display:flex; gap:10px; align-items:center; margin-left:auto; font-size:12px; color:#94a3b8; }
        .dot { width:9px; height:9px; border-radius:50%; background:#64748b; display:inline-block; }
        .dot.ok { background:#22c55e; box-shadow:0 0 8px #22c55e; }
        .dot.err { background:#ef4444; box-shadow:0 0 8px #ef4444; }

        .wrap { padding: 16px; }
        .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
        .card {
            background: rgba(30,41,59,0.75); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; overflow: hidden;
        }
        .card h3 {
            font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing:.5px;
            color: #93c5fd; padding: 10px 14px; background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .row { display:flex; justify-content:space-between; align-items:baseline;
            padding: 7px 14px; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .row:last-child { border-bottom: none; }
        .row .lbl { color: rgba(255,255,255,0.75); }
        .row .val { font-weight:700; font-variant-numeric: tabular-nums; }
        .row .val.neg { color: #f87171; }      /* Einspeisung/negativ */
        .row .unit { font-size: 11px; opacity:.6; margin-left:5px; }
        .hint { font-size: 11px; color:#64748b; padding: 12px 4px 0; }
        .loading { text-align:center; padding: 60px 0; color:#94a3b8; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <span class="title">Netzqualität · Screens (Live-Tableau)</span>
        <a href="/maschinenraum?db=nq">Netzqualität-Charts</a>
        <a href="/pac4200">PAC4200-Gerät</a>
        <a href="/maschinenraum">Maschinenraum</a>
        <span class="status">
            <span class="dot" id="dot"></span>
            <span id="statusText">Verbinde…</span>
        </span>
    </nav>

    <div class="wrap">
        <div class="grid" id="grid"><div class="loading">Lade PAC4200-Daten…</div></div>
        <div class="hint">Read-only · Auto-Refresh 2 s · Quelle: Siemens SENTRON PAC4200 am Netzanschlusspunkt (PCC). Negative Ströme/Leistungen = Einspeisung (Zweirichtungszähler).</div>
    </div>

<script>
(() => {
    if (window.PVNavUI) PVNavUI.initDrawer();
    const $ = id => document.getElementById(id);
    const fmt = v => (v === null || v === undefined) ? '---'
        : (typeof v === 'number' ? v.toLocaleString('de-DE') : v);

    function render(screens) {
        if (!screens || !screens.length) {
            $('grid').innerHTML = '<div class="loading">PAC4200 nicht erreichbar</div>';
            return;
        }
        $('grid').innerHTML = screens.map(s =>
            `<div class="card"><h3>${s.title}</h3>` +
            s.lines.map(ln => {
                const neg = (typeof ln.value === 'number' && ln.value < 0) ? ' neg' : '';
                return `<div class="row"><span class="lbl">${ln.label}</span>`
                    + `<span><span class="val${neg}">${fmt(ln.value)}</span>`
                    + `<span class="unit">${ln.unit || ''}</span></span></div>`;
            }).join('') + `</div>`
        ).join('');
    }

    async function poll() {
        try {
            const r = await fetch('/api/pac4200/live', { cache: 'no-store' });
            const j = await r.json();
            if (j.ok && Array.isArray(j.screens) && j.screens.length) {
                render(j.screens);
                $('dot').className = 'dot ok';
                $('statusText').textContent = `PAC4200 @ ${j.host} · ${new Date().toLocaleTimeString('de-DE')}`;
            } else {
                $('dot').className = 'dot err';
                $('statusText').textContent = j.error || 'PAC4200 nicht erreichbar';
                render(j.screens);
            }
        } catch (e) {
            $('dot').className = 'dot err';
            $('statusText').textContent = 'Netzwerkfehler: ' + e.message;
        }
    }
    poll();
    setInterval(poll, 2000);
})();
</script>
</body>
</html>
