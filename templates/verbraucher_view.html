<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v={{ favicon_version }}">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v={{ favicon_version }}">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v={{ favicon_version }}">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <title>Verbraucher — PV-Anlage</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="/static/js/nav-context.js"></script>
    <script src="/static/js/extremes.js"></script>
    <script src="/static/js/nav-ui.js"></script>
    <link rel="stylesheet" href="/static/css/monitoring.css">
    <link rel="stylesheet" href="/static/css/nav-ui.css">
    <style>
        /* Verbraucher-spezifische Farben */
        .status-chip.wp { background: rgba(20,184,166,0.2); }
        .status-chip.heizpatrone { background: rgba(230,81,0,0.3); }
        .status-chip.wattpilot { background: rgba(21,101,192,0.3); }
        .status-chip.haushalt { background: rgba(158,158,158,0.2); }
        .status-chip .split { font-size: 10px; opacity: 0.8; font-style: italic; }
        #verbraucherChart {
            width: 100%;
            flex: 1;
            min-height: 0;
            background: white;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Navigation Bar -->
        <div class="top-nav-bar">
            <div class="nav-left">
                <button class="active" id="btnViewTag" onclick="switchView('tag')">Tag</button>
                <button id="btnViewMonat" onclick="switchView('monat')">Monat</button>
                <button id="btnViewJahr" onclick="switchView('jahr')">Jahr</button>
                <button id="btnViewGesamt" onclick="switchView('gesamt')">Gesamt</button>
            </div>
            <div class="nav-center">
                <div id="tagNavigation" style="display:flex; gap:4px; align-items:center;">
                    <button onclick="navigate(-1)">&#9664;</button>
                    <button class="date-label" id="tagDateDisplay">Heute</button>
                    <button id="tagNext" onclick="navigate(1)">&#9654;</button>
                </div>
                <div id="monatNavigation" style="display:none; gap:4px; align-items:center;">
                    <button onclick="navigate(-1)">&#9664;</button>
                    <button class="date-label" id="monatDateDisplay">Monat</button>
                    <button id="monatNext" onclick="navigate(1)">&#9654;</button>
                </div>
                <div id="jahrNavigation" style="display:none; gap:4px; align-items:center;">
                    <button onclick="navigate(-1)">&#9664;</button>
                    <button class="date-label" id="jahrDateDisplay">Jahr</button>
                    <button id="jahrNext" onclick="navigate(1)">&#9654;</button>
                </div>
                <button class="btn-jetzt" id="btnHeute" onclick="navigateToday()">&#9201; Heute</button>
            </div>
            <div class="nav-right">
                <a href="/verbraucher/wp-leistung" class="nav-button-link" title="WP Leistungsanalyse (P-Max)" style="display:inline-flex; align-items:center; gap:6px;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" style="vertical-align: middle;">
                        <path d="M12 3.75a.75.75 0 01.75.75v6.018a4.502 4.502 0 012.134 2.105l4.236-2.446a.75.75 0 11.75 1.3l-4.236 2.446a4.5 4.5 0 010 4.212l4.236 2.446a.75.75 0 11-.75 1.3l-4.236-2.446a4.502 4.502 0 01-2.134 2.105v6.018a.75.75 0 01-1.5 0v-6.018a4.502 4.502 0 01-2.134-2.105l-4.236 2.446a.75.75 0 11-.75-1.3l4.236-2.446a4.5 4.5 0 010-4.212L4.634 9.804a.75.75 0 01.75-1.3l4.236 2.446A4.502 4.502 0 0111.25 8.85V4.5a.75.75 0 01.75-.75zM12 15.75a3 3 0 100-6 3 3 0 000 6z" />
                    </svg>
                    <span>P-Max WP</span>
                </a>
            </div>
        </div>

        <!-- Chart Area -->
        <div class="chart-area">
            <div id="summaryGrid" class="status-bar" style="display:none;"></div>
            <div id="chartLoading" class="loading">Lade Verbrauchsdaten...</div>
            <div id="chartError" class="error" style="display:none;"></div>
            <div id="verbraucherChart" style="display:none;"></div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════
        // STATE
        // ═══════════════════════════════════════
        const COLORS = { wp: '#14b8a6', heizpatrone: '#E65100', wattpilot: '#1565C0', klima: '#7E57C2', gefrier: '#00ACC1', lueftung: '#9CCC65', haushalt: '#9e9e9e' };
        const NAMES  = { wp: 'Wärmepumpe', heizpatrone: 'Heizpatrone', wattpilot: 'E-Auto', klima: 'Klima', gefrier: 'Gefriertruhe', lueftung: 'Lüftung', haushalt: 'Sonstige' };

        let currentView = 'tag';
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth() + 1;
        let chart = null;
        let periodExtremes = null;
        let tagExtremes = null;

        const MONTHS_DE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
                           'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

        function buildNavQuery(period = currentView) {
            return PVNavContext.buildQuery(
                PVNavContext.createContext(period, currentDate, currentYear, currentMonth)
            );
        }

        function updateContextLinks() {
            const links = {
                linkMonitoring: '/monitoring',
                linkAnalyse: '/analyse',
                linkErzeuger: '/erzeuger',
                linkVerbraucher: '/verbraucher',
                linkWPL: '/verbraucher/wp-leistung',
                linkAnalysePv: '/analyse/pv',
                linkAnalyseHaushalt: '/analyse/haushalt',
                linkAnalyseAmortisation: '/analyse/amortisation'
            };

            const ctx = PVNavContext.createContext(currentView, currentDate, currentYear, currentMonth);
            PVNavContext.applyToLinks(links, ctx);
            // Zentraler Zeit-Navigations-Speicher (URL + localStorage), damit
            // Seitenwechsel/Schubladen-Links den Zeitraum konsistent behalten.
            if (PVNavContext.commit) PVNavContext.commit(ctx);
        }

        function setActiveViewButton() {
            ['Tag', 'Monat', 'Jahr', 'Gesamt'].forEach(v => {
                const el = document.getElementById('btnView' + v);
                if (el) el.classList.remove('active');
            });
            const active = document.getElementById('btnView' + currentView.charAt(0).toUpperCase() + currentView.slice(1));
            if (active) active.classList.add('active');
        }

        function applyStateFromUrl() {
            const navState = PVNavContext.parse(window.location.search);
            if (!navState.hasContext) {
                return;
            }
            if (navState.isExpired) {
                PVNavContext.stripFromCurrentUrl();
                return;
            }

            currentView = navState.context.period;
            if (currentView === 'tag') {
                currentDate = new Date(`${navState.context.date}T12:00:00`);
                currentYear = currentDate.getFullYear();
                currentMonth = currentDate.getMonth() + 1;
            } else if (currentView === 'monat') {
                currentYear = navState.context.year || currentYear;
                currentMonth = navState.context.month || currentMonth;
                syncAnchors('month');
            } else if (currentView === 'jahr') {
                currentYear = navState.context.year || currentYear;
                syncAnchors('year');
            }
        }

        // ═══════════════════════════════════════
        // VIEW SWITCHING
        // ═══════════════════════════════════════
        function switchView(view) {
            currentView = view;
            ['Tag', 'Monat', 'Jahr', 'Gesamt'].forEach(v => {
                document.getElementById('btnView' + v).classList.remove('active');
            });
            document.getElementById('btnView' + view.charAt(0).toUpperCase() + view.slice(1)).classList.add('active');
            updateNavUI();
            loadData();
        }

        function updateNavUI() {
            document.getElementById('tagNavigation').style.display = currentView === 'tag' ? 'flex' : 'none';
            document.getElementById('monatNavigation').style.display = currentView === 'monat' ? 'flex' : 'none';
            document.getElementById('jahrNavigation').style.display = currentView === 'jahr' ? 'flex' : 'none';

            setActiveViewButton();
            const btnHeute = document.getElementById('btnHeute');

            if (currentView === 'tag') {
                document.getElementById('tagDateDisplay').textContent =
                    currentDate.toLocaleDateString('de-DE', { day: '2-digit', month: 'short', year: 'numeric' });
                btnHeute.style.display = '';
            } else if (currentView === 'monat') {
                document.getElementById('monatDateDisplay').textContent =
                    `${MONTHS_DE[currentMonth - 1]} ${currentYear}`;
                btnHeute.style.display = '';
            } else if (currentView === 'jahr') {
                document.getElementById('jahrDateDisplay').textContent = String(currentYear);
                btnHeute.style.display = '';
            } else {
                btnHeute.style.display = 'none';
            }
            const atFuture = isAtOrAfterToday();
            ['tagNext', 'monatNext', 'jahrNext'].forEach(id => {
                const b = document.getElementById(id);
                if (b) b.disabled = atFuture;
            });
            updateContextLinks();
        }

        // Hält currentDate/currentYear/currentMonth konsistent zu EINEM Zeitpunkt,
        // damit ein Auflösungswechsel (Tag<->Monat<->Jahr) den Zeitraum behält.
        function syncAnchors(source) {
            const a = { date: currentDate, year: currentYear, month: currentMonth };
            PVNavContext.syncAnchorFrom(a, source);
            currentDate = a.date;
            currentYear = a.year;
            currentMonth = a.month;
        }

        // True, sobald der gewählte Zeitraum die Gegenwart erreicht/überschreitet.
        function isAtOrAfterToday() {
            const now = new Date();
            if (currentView === 'tag') {
                const d = new Date(currentDate); d.setHours(0, 0, 0, 0);
                const n = new Date(now); n.setHours(0, 0, 0, 0);
                return d >= n;
            }
            if (currentView === 'monat') {
                return currentYear > now.getFullYear()
                    || (currentYear === now.getFullYear() && currentMonth >= now.getMonth() + 1);
            }
            if (currentView === 'jahr') return currentYear >= now.getFullYear();
            return true;
        }

        function navigate(delta) {
            if (delta > 0 && isAtOrAfterToday()) return;  // keine Navigation in die Zukunft
            if (currentView === 'tag') {
                currentDate.setDate(currentDate.getDate() + delta);
                syncAnchors('date');
            } else if (currentView === 'monat') {
                currentMonth += delta;
                if (currentMonth > 12) { currentMonth = 1; currentYear++; }
                if (currentMonth < 1) { currentMonth = 12; currentYear--; }
                syncAnchors('month');
            } else if (currentView === 'jahr') {
                currentYear += delta;
                syncAnchors('year');
            }
            updateNavUI();
            loadData();
        }

        function navigateToday() {
            const now = new Date();
            currentDate = new Date(now);
            currentYear = now.getFullYear();
            currentMonth = now.getMonth() + 1;
            updateNavUI();
            loadData();
        }

        function formatDateISO(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function isMobile() {
            return window.innerWidth <= 600 || (window.innerHeight <= 500 && window.matchMedia('(orientation: landscape)').matches);
        }

        // ═══════════════════════════════════════
        // DATA LOADING
        // ═══════════════════════════════════════
        async function loadData() {
            document.getElementById('chartLoading').style.display = 'block';
            document.getElementById('chartError').style.display = 'none';
            document.getElementById('verbraucherChart').style.display = 'none';
            document.getElementById('summaryGrid').style.display = 'none';

            let url;
            if (currentView === 'tag') {
                url = `/api/verbraucher/tag?date=${formatDateISO(currentDate)}`;
            } else if (currentView === 'monat') {
                url = `/api/verbraucher/monat?year=${currentYear}&month=${currentMonth}`;
            } else if (currentView === 'jahr') {
                url = `/api/verbraucher/jahr?year=${currentYear}`;
            } else {
                url = '/api/verbraucher/gesamt';
            }

            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();

                // Perioden-Extremwerte (konsistent mit Monitoring/Erzeuger)
                if (currentView !== 'tag' && window.PVExtremes) {
                    periodExtremes = await PVExtremes.fetchFor(currentView, { year: currentYear, month: currentMonth });
                    tagExtremes = null;
                } else if (window.PVExtremes) {
                    const ex = await PVExtremes.fetchFor('tag', { date: formatDateISO(currentDate) });
                    tagExtremes = ex ? ex.overall : null;
                    periodExtremes = null;
                }

                document.getElementById('chartLoading').style.display = 'none';
                document.getElementById('verbraucherChart').style.display = 'block';
                document.getElementById('summaryGrid').style.display = 'flex';

                updateSummary(data.totals, data.average_summary || null);

                if (currentView === 'tag') {
                    createDayChart(data);
                } else {
                    createBarChart(data);
                }
            } catch (err) {
                document.getElementById('chartLoading').style.display = 'none';
                document.getElementById('chartError').style.display = 'block';
                document.getElementById('chartError').textContent = 'Fehler: ' + err.message;
            }
        }

        // ═══════════════════════════════════════
        // SUMMARY
        // ═══════════════════════════════════════
        function formatEnergy(kwh) {
            if (kwh >= 1000) return `${(kwh / 1000).toFixed(2)} MWh`;
            if (kwh >= 100) return `${kwh.toFixed(0)} kWh`;
            if (kwh >= 10) return `${kwh.toFixed(1)} kWh`;
            return `${kwh.toFixed(2)} kWh`;
        }

        function updateSummary(totals, averageSummary = null) {
            if (!totals) return;
            const grid = document.getElementById('summaryGrid');
            const gesamt = totals.gesamt || 0.001;
            const pctWP   = (totals.wp          / gesamt * 100).toFixed(0);
            const pctHP   = (totals.heizpatrone / gesamt * 100).toFixed(0);
            const pctWatt = (totals.wattpilot   / gesamt * 100).toFixed(0);
            const pctHH   = (totals.haushalt    / gesamt * 100).toFixed(0);
            const pctKli  = ((totals.klima    || 0) / gesamt * 100).toFixed(0);
            const pctGef  = ((totals.gefrier  || 0) / gesamt * 100).toFixed(0);
            const pctLue  = ((totals.lueftung || 0) / gesamt * 100).toFixed(0);
            const showAverages = currentView !== 'tag' && averageSummary && averageSummary.values;

            function averageLine(key) {
                if (!showAverages) return '';
                const value = averageSummary.values[key];
                if (typeof value !== 'number') return '';
                return `<span class="split">Ø ${averageSummary.unit_label}: ${formatEnergy(value)}</span>`;
            }

            grid.innerHTML = `
                <div class="status-chip wp">
                    <span class="label">WP</span>
                    <span class="val">${formatEnergy(totals.wp)}</span>
                    <span class="pct">${pctWP}%</span>
                    ${averageLine('wp')}
                </div>
                <div class="status-chip heizpatrone">
                    <span class="label">HP</span>
                    <span class="val">${formatEnergy(totals.heizpatrone)}</span>
                    <span class="pct">${pctHP}%</span>
                    ${averageLine('heizpatrone')}
                </div>
                <div class="status-chip wattpilot">
                    <span class="label">E-Auto</span>
                    <span class="val">${formatEnergy(totals.wattpilot)}</span>
                    <span class="pct">${pctWatt}%</span>
                    ${averageLine('wattpilot')}
                </div>
                ${(totals.klima > 0) ? `
                <div class="status-chip klima">
                    <span class="label">Klima</span>
                    <span class="val">${formatEnergy(totals.klima)}</span>
                    <span class="pct">${pctKli}%</span>
                    ${averageLine('klima')}
                </div>` : ''}
                ${(totals.gefrier > 0) ? `
                <div class="status-chip gefrier">
                    <span class="label">Gefrier</span>
                    <span class="val">${formatEnergy(totals.gefrier)}</span>
                    <span class="pct">${pctGef}%</span>
                    ${averageLine('gefrier')}
                </div>` : ''}
                ${(totals.lueftung > 0) ? `
                <div class="status-chip lueftung">
                    <span class="label">Lüftung</span>
                    <span class="val">${formatEnergy(totals.lueftung)}</span>
                    <span class="pct">${pctLue}%</span>
                    ${averageLine('lueftung')}
                </div>` : ''}
                <div class="status-chip haushalt">
                    <span class="label">Sonstige</span>
                    <span class="val">${formatEnergy(totals.haushalt)}</span>
                    <span class="pct">${pctHH}%</span>
                </div>
                <div class="status-chip gesamt">
                    <span class="label">Gesamt</span>
                    <span class="val">${formatEnergy(totals.gesamt)}</span>
                </div>
            `;
        }

        // ═══════════════════════════════════════
        // TAG-CHART (Linien, 5-min, feste 24h-Achse)
        // ═══════════════════════════════════════
        function createDayChart(data) {
            if (chart) { chart.dispose(); chart = null; }
            const el = document.getElementById('verbraucherChart');
            chart = echarts.init(el);

            // Feste 24h x-Achse (00:00 bis 23:55, 5-min-Intervalle = 288 Slots)
            const allTimes = [];
            for (let h = 0; h < 24; h++) {
                for (let m = 0; m < 60; m += 5) {
                    allTimes.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
                }
            }

            // Daten auf Zeitslots mappen
            const dp = data.datapoints;
            const byTime = {};
            dp.forEach(d => {
                const dt = new Date(d.timestamp * 1000);
                const key = `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
                byTime[key] = d;
            });

            const wpData   = allTimes.map(t => byTime[t] ? byTime[t].p_wp          : null);
            const hpData   = allTimes.map(t => byTime[t] ? byTime[t].p_heizpatrone  : null);
            const wattData = allTimes.map(t => byTime[t] ? byTime[t].p_wattpilot    : null);
            const klimaData = allTimes.map(t => byTime[t] ? byTime[t].p_klima      : null);
            const gefrierData = allTimes.map(t => byTime[t] ? byTime[t].p_gefrier   : null);
            const lueftungData = allTimes.map(t => byTime[t] ? byTime[t].p_lueftung : null);
            const hhData   = allTimes.map(t => byTime[t] ? byTime[t].p_haushalt     : null);

            // Peak-Leistung (genau 1 Marker) – Maximum des Gesamtverbrauchs, inkl. Uhrzeit.
            const gesamtData = allTimes.map(t => byTime[t] ? byTime[t].p_gesamt : null);
            let peakIdx = -1, peakVal = -Infinity;
            gesamtData.forEach((v, i) => { if (Number.isFinite(v) && v > peakVal) { peakVal = v; peakIdx = i; } });
            const narrow = window.innerWidth < 560;
            const peakMarkPoint = (peakIdx >= 0 && peakVal > 0) ? {
                symbol: 'pin', symbolSize: narrow ? 16 : 20, symbolOffset: [0, -2],
                itemStyle: { color: COLORS.haushalt, borderColor: 'rgba(255,255,255,0.7)', borderWidth: 1 },
                label: {
                    show: true, position: 'top', color: COLORS.haushalt, fontSize: narrow ? 9 : 11, fontWeight: 'normal',
                    backgroundColor: 'rgba(255,255,255,0.92)', padding: [2, 4], borderRadius: 3,
                    formatter: () => narrow ? `▲${(peakVal/1000).toFixed(1)}` : `Peak ${(peakVal/1000).toFixed(2)} kW`
                },
                data: [{ coord: [allTimes[peakIdx], peakVal], value: peakVal }],
                tooltip: {
                    show: true, trigger: 'item',
                    formatter: () => `<b>Peak-Verbrauch</b><br/>${(peakVal/1000).toFixed(2)} kW<br/>${allTimes[peakIdx]} Uhr`
                }
            } : null;

            const option = {
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        if (!params || params.length === 0) return '';
                        const timeStr = params[0].axisValue;
                        const d = byTime[timeStr];
                        if (!d) return `<strong>${timeStr}</strong><br/>Keine Daten`;
                        let html = `<strong>${timeStr}</strong><br/><br/>`;
                        html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.wp};border-radius:2px;margin-right:5px;"></span>Wärmepumpe: <strong>${d.p_wp.toFixed(0)} W</strong><br/>`;
                        html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.heizpatrone};border-radius:2px;margin-right:5px;"></span>Heizpatrone: <strong>${d.p_heizpatrone.toFixed(0)} W</strong><br/>`;
                        html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.wattpilot};border-radius:2px;margin-right:5px;"></span>E-Auto: <strong>${d.p_wattpilot.toFixed(0)} W</strong><br/>`;
                        if (d.p_klima > 0) html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.klima};border-radius:2px;margin-right:5px;"></span>Klima: <strong>${d.p_klima.toFixed(0)} W</strong><br/>`;
                        if (d.p_gefrier > 0) html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.gefrier};border-radius:2px;margin-right:5px;"></span>Gefriertruhe: <strong>${d.p_gefrier.toFixed(0)} W</strong><br/>`;
                        if (d.p_lueftung > 0) html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.lueftung};border-radius:2px;margin-right:5px;"></span>Lüftung: <strong>${d.p_lueftung.toFixed(0)} W</strong><br/>`;
                        html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.haushalt};border-radius:2px;margin-right:5px;"></span>Sonstige: <strong>${d.p_haushalt.toFixed(0)} W</strong><br/>`;
                        html += `<hr style="border:none;border-top:1px solid #ccc;margin:6px 0;"/>`;
                        html += `<strong>Gesamt: ${d.p_gesamt.toFixed(0)} W</strong>`;
                        if (tagExtremes && window.PVExtremes) {
                            const tl = PVExtremes.tagLines(tagExtremes);
                            if (tl) html += `<hr style="border:none;border-top:1px solid #ccc;margin:6px 0;"/>` + tl;
                        }
                        return html;
                    }
                },
                legend: {
                    data: ['Wärmepumpe', 'Heizpatrone', 'E-Auto', 'Klima', 'Gefriertruhe', 'Lüftung', 'Sonstige'],
                    bottom: 10
                },
                grid: {
                    left: '3%', right: '4%',
                    bottom: '70px', top: '35px',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: allTimes,
                    boundaryGap: false,
                    axisLabel: (function() {
                        const w = window.innerWidth;
                        // Dynamisch: bei schmalen Fenstern weniger Labels
                        const step = w < 500 ? 36 : w < 800 ? 24 : 12;
                        return {
                            interval: function(idx) { return idx % step === 0; },
                            fontSize: w < 500 ? 9 : 11
                        };
                    })()
                },
                yAxis: {
                    type: 'value',
                    name: 'Leistung (W)',
                    nameLocation: 'end',
                    min: 0,
                    max: function(value) {
                        return Math.min(30000, Math.max(10000, Math.ceil(value.max / 1000) * 1000));
                    },
                    axisLabel: { formatter: '{value} W' }
                },
                series: [
                    {
                        name: 'Wärmepumpe',
                        type: 'line',
                        data: wpData,
                        itemStyle: { color: COLORS.wp },
                        lineStyle: { width: 2 },
                        smooth: true,
                        symbol: 'none',
                        areaStyle: { color: COLORS.wp, opacity: 0.15 }
                    },
                    {
                        name: 'Heizpatrone',
                        type: 'line',
                        data: hpData,
                        itemStyle: { color: COLORS.heizpatrone },
                        lineStyle: { width: 2 },
                        smooth: true,
                        symbol: 'none',
                        areaStyle: { color: COLORS.heizpatrone, opacity: 0.15 }
                    },
                    {
                        name: 'E-Auto',
                        type: 'line',
                        data: wattData,
                        itemStyle: { color: COLORS.wattpilot },
                        lineStyle: { width: 2 },
                        smooth: true,
                        symbol: 'none',
                        areaStyle: { color: COLORS.wattpilot, opacity: 0.15 }
                    },
                    {
                        name: 'Klima',
                        type: 'line',
                        data: klimaData,
                        itemStyle: { color: COLORS.klima },
                        lineStyle: { width: 2 },
                        smooth: true,
                        symbol: 'none',
                        areaStyle: { color: COLORS.klima, opacity: 0.12 }
                    },
                    {
                        name: 'Gefriertruhe',
                        type: 'line',
                        data: gefrierData,
                        itemStyle: { color: COLORS.gefrier },
                        lineStyle: { width: 2 },
                        smooth: true,
                        symbol: 'none',
                        areaStyle: { color: COLORS.gefrier, opacity: 0.12 }
                    },
                    {
                        name: 'Lüftung',
                        type: 'line',
                        data: lueftungData,
                        itemStyle: { color: COLORS.lueftung },
                        lineStyle: { width: 2 },
                        smooth: true,
                        symbol: 'none',
                        areaStyle: { color: COLORS.lueftung, opacity: 0.12 }
                    },
                    {
                        name: 'Sonstige',
                        type: 'line',
                        data: hhData,
                        itemStyle: { color: COLORS.haushalt },
                        lineStyle: { width: 2 },
                        smooth: true,
                        symbol: 'none',
                        areaStyle: { color: COLORS.haushalt, opacity: 0.15 },
                        markPoint: peakMarkPoint || undefined
                    }
                ]
            };

            if (window.PVChart) option.tooltip = PVChart.tooltipResponsive(option.tooltip);
            chart.setOption(option);
            window.addEventListener('resize', () => {
                if (!chart) return;
                chart.resize();
                // X-Achsen-Labels dynamisch an neue Breite anpassen
                const w = window.innerWidth;
                const step = w < 500 ? 36 : w < 800 ? 24 : 12;
                chart.setOption({
                    xAxis: {
                        axisLabel: {
                            interval: function(idx) { return idx % step === 0; },
                            fontSize: w < 500 ? 9 : 11
                        }
                    }
                });
            });
        }

        applyStateFromUrl();

        // ═══════════════════════════════════════
        // BAR-CHART (Monat/Jahr/Gesamt)
        // ═══════════════════════════════════════
        function createBarChart(data) {
            if (chart) { chart.dispose(); chart = null; }
            const el = document.getElementById('verbraucherChart');
            chart = echarts.init(el);

            const dp = data.datapoints;
            let labels;

            if (currentView === 'monat') {
                const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
                labels = Array.from({length: daysInMonth}, (_, i) => `${i + 1}.`);
            } else if (currentView === 'jahr') {
                labels = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
            } else {
                if (data.year_range) {
                    const minY = data.year_range[0];
                    const maxY = data.year_range[1];
                    labels = [];
                    for (let y = minY; y <= maxY; y++) labels.push(String(y));
                } else {
                    labels = dp.map(d => d.label);
                }
            }

            const byKey = {};
            dp.forEach(d => {
                if (currentView === 'monat') byKey[d.day] = d;
                else if (currentView === 'jahr') byKey[d.month] = d;
                else byKey[d.label] = d;
            });

            const wpData   = labels.map((l, i) => {
                const key = currentView === 'monat' ? (i + 1) : (currentView === 'jahr' ? (i + 1) : l);
                return byKey[key] ? byKey[key].w_wp : null;
            });
            const hpData   = labels.map((l, i) => {
                const key = currentView === 'monat' ? (i + 1) : (currentView === 'jahr' ? (i + 1) : l);
                return byKey[key] ? byKey[key].w_heizpatrone : null;
            });
            const wattData = labels.map((l, i) => {
                const key = currentView === 'monat' ? (i + 1) : (currentView === 'jahr' ? (i + 1) : l);
                return byKey[key] ? byKey[key].w_wattpilot : null;
            });
            const klimaData = labels.map((l, i) => {
                const key = currentView === 'monat' ? (i + 1) : (currentView === 'jahr' ? (i + 1) : l);
                return byKey[key] ? byKey[key].w_klima : null;
            });
            const gefrierData = labels.map((l, i) => {
                const key = currentView === 'monat' ? (i + 1) : (currentView === 'jahr' ? (i + 1) : l);
                return byKey[key] ? byKey[key].w_gefrier : null;
            });
            const lueftungData = labels.map((l, i) => {
                const key = currentView === 'monat' ? (i + 1) : (currentView === 'jahr' ? (i + 1) : l);
                return byKey[key] ? byKey[key].w_lueftung : null;
            });
            const hhData   = labels.map((l, i) => {
                const key = currentView === 'monat' ? (i + 1) : (currentView === 'jahr' ? (i + 1) : l);
                return byKey[key] ? byKey[key].w_haushalt : null;
            });

            // Rekord-/Extremwert-Relation über alle Balken der aktuellen Auflösung.
            const MON_FULL = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
            const citeFmt = (e) => {
                if (currentView === 'jahr') return `${formatEnergy(e.value)} im ${MON_FULL[e.idx]}`;
                if (currentView === 'gesamt') return `${formatEnergy(e.value)} in ${labels[e.idx]}`;
                return `${formatEnergy(e.value)} am ${e.idx + 1}.`;
            };
            const ranking = labels.map((l, i) => {
                const key = currentView === 'monat' ? (i + 1) : (currentView === 'jahr' ? (i + 1) : l);
                const d = byKey[key];
                return { idx: i, value: (d && Number.isFinite(d.w_gesamt)) ? d.w_gesamt : null };
            }).filter(x => x.value != null && x.value > 0);
            const rkDesc = [...ranking].sort((a, b) => b.value - a.value);
            const rkAsc = [...ranking].sort((a, b) => a.value - b.value);
            const recMax = rkDesc[0] || null, secMax = rkDesc[1] || null;
            const recMin = rkAsc[0] || null, secMin = rkAsc[1] || null;
            function buildRecordRelation(idx, cur) {
                if (!Number.isFinite(cur) || ranking.length < 2 || !recMax || !recMin) return '';
                let s = `<hr style="border:none;border-top:1px solid #ccc;margin:6px 0;"/>`;
                if (recMax.idx === idx) {
                    s += `Größter Verbrauch`;
                    if (secMax) s += `<br/><span style="opacity:.7">${citeFmt(secMax)}</span>`;
                } else {
                    s += `<span style="opacity:.85">Größter Verbrauch: ${citeFmt(recMax)}</span>`;
                }
                s += '<br/>';
                if (recMin.idx === idx) {
                    s += `Kleinster Verbrauch`;
                    if (secMin) s += `<br/><span style="opacity:.7">${citeFmt(secMin)}</span>`;
                } else {
                    s += `<span style="opacity:.85">Kleinster Verbrauch: ${citeFmt(recMin)}</span>`;
                }
                return s;
            }

            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    formatter: function(params) {
                        if (!params || params.length === 0) return '';
                        const idx = params[0].dataIndex;
                        let key, titleStr;

                        if (currentView === 'monat') {
                            const day = idx + 1;
                            key = day;
                            const datum = new Date(currentYear, currentMonth - 1, day);
                            titleStr = datum.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
                        } else if (currentView === 'jahr') {
                            key = idx + 1;
                            titleStr = labels[idx] + ' ' + currentYear;
                        } else {
                            key = labels[idx];
                            titleStr = key;
                        }

                        const d = byKey[key];
                        if (!d) return `<strong>${titleStr}</strong><br/>Keine Daten`;

                        let html = `<strong>${titleStr}</strong><br/><br/>`;
                        html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.wp};border-radius:2px;margin-right:5px;"></span>WP: <strong>${formatEnergy(d.w_wp)}</strong><br/>`;
                        html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.heizpatrone};border-radius:2px;margin-right:5px;"></span>HP (Überschuss): <strong>${formatEnergy(d.w_heizpatrone)}</strong><br/>`;
                        html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.wattpilot};border-radius:2px;margin-right:5px;"></span>E-Auto: <strong>${formatEnergy(d.w_wattpilot)}</strong><br/>`;
                        if (d.w_klima) html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.klima};border-radius:2px;margin-right:5px;"></span>Klima: <strong>${formatEnergy(d.w_klima)}</strong><br/>`;
                        if (d.w_gefrier) html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.gefrier};border-radius:2px;margin-right:5px;"></span>Gefriertruhe: <strong>${formatEnergy(d.w_gefrier)}</strong><br/>`;
                        if (d.w_lueftung) html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.lueftung};border-radius:2px;margin-right:5px;"></span>Lüftung: <strong>${formatEnergy(d.w_lueftung)}</strong><br/>`;
                        html += `<span style="display:inline-block;width:10px;height:10px;background:${COLORS.haushalt};border-radius:2px;margin-right:5px;"></span>Sonstige: <strong>${formatEnergy(d.w_haushalt)}</strong><br/>`;
                        html += `<hr style="border:none;border-top:1px solid #ccc;margin:6px 0;"/>`;
                        html += `<strong>Gesamt: ${formatEnergy(d.w_gesamt)}</strong>`;
                        html += buildRecordRelation(idx, d.w_gesamt);
                        if (periodExtremes && periodExtremes.by_key && window.PVExtremes) {
                            html += PVExtremes.lines(periodExtremes.by_key[String(key)], { period: currentView });
                        }
                        return html;
                    }
                },
                legend: {
                    data: ['Wärmepumpe', 'Heizpatrone', 'E-Auto', 'Klima', 'Gefriertruhe', 'Lüftung', 'Sonstige'],
                    bottom: 10,
                    ...(isMobile() ? { textStyle: { fontSize: 9 }, itemWidth: 12, itemHeight: 8, itemGap: 6 } : {})
                },
                grid: {
                    left: '3%', right: '4%',
                    bottom: '70px', top: '35px',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: labels,
                    axisLabel: {
                        interval: 0,
                        rotate: labels.length > 15 ? 45 : 0,
                        fontSize: 11
                    }
                },
                yAxis: {
                    type: 'value',
                    name: 'kWh',
                    nameLocation: 'end',
                    axisLabel: { formatter: '{value}' }
                },
                animation: false,
                series: [
                    {
                        name: 'Wärmepumpe',
                        type: 'bar',
                        stack: 'verbrauch',
                        data: wpData,
                        itemStyle: { color: COLORS.wp },
                        emphasis: { disabled: true }
                    },
                    {
                        name: 'Heizpatrone',
                        type: 'bar',
                        stack: 'verbrauch',
                        data: hpData,
                        itemStyle: { color: COLORS.heizpatrone },
                        emphasis: { disabled: true }
                    },
                    {
                        name: 'E-Auto',
                        type: 'bar',
                        stack: 'verbrauch',
                        data: wattData,
                        itemStyle: { color: COLORS.wattpilot },
                        emphasis: { disabled: true }
                    },
                    {
                        name: 'Klima',
                        type: 'bar',
                        stack: 'verbrauch',
                        data: klimaData,
                        itemStyle: { color: COLORS.klima },
                        emphasis: { disabled: true }
                    },
                    {
                        name: 'Gefriertruhe',
                        type: 'bar',
                        stack: 'verbrauch',
                        data: gefrierData,
                        itemStyle: { color: COLORS.gefrier },
                        emphasis: { disabled: true }
                    },
                    {
                        name: 'Lüftung',
                        type: 'bar',
                        stack: 'verbrauch',
                        data: lueftungData,
                        itemStyle: { color: COLORS.lueftung },
                        emphasis: { disabled: true }
                    },
                    {
                        name: 'Sonstige',
                        type: 'bar',
                        stack: 'verbrauch',
                        data: hhData,
                        itemStyle: { color: COLORS.haushalt },
                        emphasis: { disabled: true }
                    }
                ]
            };

            if (window.PVChart) {
                option.tooltip = PVChart.tooltipResponsive(option.tooltip);
                option.xAxis.axisLabel = PVChart.xAxisLabel((option.xAxis.data || []).length);
            }
            chart.setOption(option);
            if (currentView === 'gesamt') {
                chart.on('click', function(params) {
                    if (params.componentType !== 'series') return;
                    const selected = byKey[labels[params.dataIndex]];
                    if (!selected || !selected.year) return;
                    currentYear = selected.year;
                    switchView('jahr');
                });
            } else if (currentView === 'jahr') {
                chart.on('click', function(params) {
                    if (params.componentType !== 'series') return;
                    currentMonth = params.dataIndex + 1;
                    switchView('monat');
                });
            } else if (currentView === 'monat') {
                chart.on('click', function(params) {
                    if (params.componentType !== 'series') return;
                    currentDate = new Date(currentYear, currentMonth - 1, params.dataIndex + 1);
                    switchView('tag');
                });
            }
            window.addEventListener('resize', () => { if (chart) chart.resize(); });
        }

        // ═══════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════
        updateNavUI();
        loadData();
        // Seiten-Schublade + Kalender-Picker (Zeit-Navi bleibt oben)
        if (window.PVNavUI) {
            PVNavUI.initDrawer();
            const isoDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            const _now = new Date();
            const _todayISO = isoDay(_now);
            const _thisMonth = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}`;
            PVNavUI.attachCalendar(document.getElementById('tagDateDisplay'), 'day',
                () => isoDay(currentDate),
                v => { currentDate = new Date(`${v}T12:00:00`); syncAnchors('date'); updateNavUI(); loadData(); },
                { min: '2021-01-01', max: _todayISO });
            PVNavUI.attachCalendar(document.getElementById('monatDateDisplay'), 'month',
                () => `${currentYear}-${String(currentMonth).padStart(2,'0')}`,
                v => { const p = v.split('-'); currentYear = +p[0]; currentMonth = +p[1]; syncAnchors('month'); updateNavUI(); loadData(); },
                { min: '2021-01', max: _thisMonth });
            PVNavUI.attachCalendar(document.getElementById('jahrDateDisplay'), 'day',
                () => isoDay(new Date(currentYear, 0, 1)),
                v => { currentYear = new Date(`${v}T12:00:00`).getFullYear(); syncAnchors('year'); updateNavUI(); loadData(); },
                { min: '2021-01-01', max: _todayISO });
        }    </script>

    {% include 'info_overlay.html' %}
</body>
