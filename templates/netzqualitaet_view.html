<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v={{ favicon_version }}">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v={{ favicon_version }}">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <title>Netzqualität - PV-System</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            padding: 8px 16px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            gap: 12px;
            flex-shrink: 0;
        }
        .top-nav a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.2s;
        }
        .top-nav a:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .top-nav a.active {
            color: #fff;
            background: rgba(0, 175, 0, 0.25);
            border: 1px solid rgba(0, 175, 0, 0.4);
        }
        .nav-separator {
            width: 1px;
            height: 20px;
            background: rgba(255,255,255,0.15);
        }
        .nav-group { display: flex; gap: 4px; align-items: center; }
        .nav-btn {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .toggle-group { display: flex; gap: 0; }
        .period-group { display: flex; gap: 0; }
        .period-group .toggle-btn {
            min-width: 58px;
        }
        .toggle-btn {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .toggle-btn:first-child { border-radius: 5px 0 0 5px; }
        .toggle-btn:last-child { border-radius: 0 5px 5px 0; border-left: none; }
        .toggle-btn.active {
            background: rgba(70, 70, 255, 0.25);
            color: #fff;
            border-color: rgba(70, 70, 255, 0.5);
        }
        .toggle-btn:hover:not(.active) { background: rgba(255,255,255,0.12); color: #ccc; }
        .date-label {
            background: transparent;
            color: #fff;
            border: none;
            padding: 5px 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .status-info {
            margin-left: auto;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            white-space: nowrap;
        }

        .chart-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            min-height: 0;
        }
        .chart-box {
            flex: 1;
            min-height: 0;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 8px;
            position: relative;
        }
        .chart-box .chart-title {
            position: absolute;
            top: 8px;
            left: 14px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            z-index: 10;
            pointer-events: none;
        }
        .chart-box .minmax-info {
            position: absolute;
            top: 8px;
            right: 14px;
            font-size: 11px;
            color: rgba(255,255,255,0.72);
            z-index: 10;
            pointer-events: none;
            font-variant-numeric: tabular-nums;
            text-align: right;
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #mainChart {
            width: 100%;
            height: 100%;
        }

        .future-hint {
            text-align: center;
            padding: 16px;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            flex-shrink: 0;
        }
        .future-hint a {
            color: rgba(0, 175, 0, 0.6);
            text-decoration: none;
        }
        .future-hint a:hover { color: rgba(0, 175, 0, 0.9); }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .top-nav { padding: 6px 8px; gap: 6px; }
            .top-nav a { font-size: 11px; padding: 4px 8px; }
            .top-nav .toggle-btn,
            .top-nav .nav-btn,
            .top-nav .date-label { font-size: 11px; padding: 4px 7px; }
            .status-info {
                width: 100%;
                margin-left: 0;
                text-align: center;
            }
            .chart-box .chart-title {
                font-size: 10px;
                max-width: 55%;
            }
            .chart-box .minmax-info {
                font-size: 9px;
                max-width: 60%;
            }
            .chart-area { padding: 4px; gap: 4px; }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="/">Flow</a>
        <a href="/monitoring">Monitoring</a>
        <a href="/maschinenraum">Maschinenraum</a>
        <div class="nav-separator"></div>
        <a href="/netzqualitaet" class="active">Netzqualität</a>
        <div class="nav-separator"></div>
        <div class="toggle-group">
            <button class="toggle-btn active" id="btnLokal" onclick="setViewMode('lokal')">Lokal</button>
            <button class="toggle-btn" id="btnNetz" onclick="setViewMode('netz')">Netz</button>
        </div>
        <div class="nav-separator"></div>
        <div class="period-group">
            <button class="toggle-btn active" id="btnPeriodTag" onclick="setPeriod('tag')">Tag</button>
            <button class="toggle-btn" id="btnPeriodMonat" onclick="setPeriod('monat')">Monat</button>
            <button class="toggle-btn" id="btnPeriodJahr" onclick="setPeriod('jahr')">Jahr</button>
            <button class="toggle-btn" id="btnPeriodGesamt" onclick="setPeriod('gesamt')">Gesamt</button>
        </div>
        <div class="nav-separator"></div>
        <button class="toggle-btn active" id="btnAnalyse" onclick="toggleAnalysis()" style="border-radius:5px">15min</button>
        <div class="nav-separator"></div>
        <div class="nav-group">
            <button class="nav-btn" id="navPrev" onclick="navigateStep(-1)">◀</button>
            <button class="date-label" id="dateDisplay" onclick="navigateToToday()">Heute</button>
            <button class="nav-btn" id="navNext" onclick="navigateStep(1)">▶</button>
        </div>
        <span class="status-info" id="statusInfo">Lädt...</span>
    </div>

    <div class="chart-area">
        <div class="chart-box">
            <span class="chart-title" id="chartTitle">Leiterspannungen L-L [V] · Netzfrequenz [Hz]</span>
            <span class="minmax-info" id="minMaxInfo">Min/Max: --</span>
            <div id="mainChart"></div>
            <div class="loading" id="loadingMain">Lade Netzqualitätsdaten...</div>
        </div>
    </div>

    <div class="future-hint">
        Zoom + Shift aktiv · Automatische Datenstufe: RAW -> 1min -> 15min -> monthly
    </div>

    <script>
        let mainChart = null;
        let currentDate = new Date();
        let currentPeriod = 'tag';
        let viewMode = 'lokal';
        let currentData = null;
        let currentDateStr = null;
        let currentMeta = null;
        let analysisData = null;
        let maximaData = null;
        let showAnalysis = true;

        function formatDateISO(d) {
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        }

        function normalizeDateForPeriod(d, period) {
            const out = new Date(d);
            if (period === 'monat') {
                out.setDate(1);
            } else if (period === 'jahr') {
                out.setMonth(0, 1);
            }
            return out;
        }

        function shiftDateByPeriod(offset) {
            const next = new Date(currentDate);
            if (currentPeriod === 'tag') {
                next.setDate(next.getDate() + offset);
            } else if (currentPeriod === 'monat') {
                next.setMonth(next.getMonth() + offset, 1);
            } else if (currentPeriod === 'jahr') {
                next.setFullYear(next.getFullYear() + offset, 0, 1);
            }
            currentDate = normalizeDateForPeriod(next, currentPeriod);
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('btnLokal').classList.toggle('active', mode === 'lokal');
            document.getElementById('btnNetz').classList.toggle('active', mode === 'netz');
            document.getElementById('chartTitle').textContent = mode === 'lokal'
                ? 'Leiterspannungen L-L [V] · Netzfrequenz [Hz]'
                : 'Netzspannung (bereinigt) [V] · Netzfrequenz [Hz]';
            if (currentData && currentDateStr) renderChart(currentData, currentDateStr);
        }

        function numberRange(values) {
            const valid = values.filter(v => Number.isFinite(v));
            if (!valid.length) return null;
            return { min: Math.min(...valid), max: Math.max(...valid) };
        }

        function fmtRange(range, digits) {
            if (!range) return '--';
            return `${range.min.toFixed(digits)}-${range.max.toFixed(digits)}`;
        }

        function formatTs(ts) {
            if (!Number.isFinite(ts)) return '--';
            return new Date(ts * 1000).toLocaleString('de-DE', {
                day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit'
            });
        }

        function updateMinMaxInfo(data) {
            const infoEl = document.getElementById('minMaxInfo');
            if (!data || !Array.isArray(data.datapoints) || data.datapoints.length === 0) {
                infoEl.textContent = 'Min/Max: --';
                return;
            }

            const freqRange = numberRange(
                data.datapoints.flatMap(dp => [dp.f_netz_min, dp.f_netz_max, dp.f_netz])
            );

            const collector = maximaData && maximaData.available ? maximaData.maxima : null;

            if (viewMode === 'lokal') {
                const l1Range = numberRange(data.datapoints.flatMap(dp => [dp.u_l1_l2_min, dp.u_l1_l2_max, dp.u_l1_l2]));
                const l2Range = numberRange(data.datapoints.flatMap(dp => [dp.u_l2_l3_min, dp.u_l2_l3_max, dp.u_l2_l3]));
                const l3Range = numberRange(data.datapoints.flatMap(dp => [dp.u_l3_l1_min, dp.u_l3_l1_max, dp.u_l3_l1]));
                const vmaxText = collector && collector.u_voltage_max
                    ? ` | Vmax ${collector.u_voltage_max.value.toFixed(1)} V @ ${formatTs(collector.u_voltage_max.ts)}`
                    : '';
                infoEl.textContent =
                    `L1-L2 ${fmtRange(l1Range, 1)} V | ` +
                    `L2-L3 ${fmtRange(l2Range, 1)} V | ` +
                    `L3-L1 ${fmtRange(l3Range, 1)} V | ` +
                    `f ${fmtRange(freqRange, 3)} Hz` +
                    vmaxText;
                return;
            }

            const netzMinRange = numberRange(data.datapoints.map(dp => {
                if (Number.isFinite(dp.u_l1_l2_min) && Number.isFinite(dp.u_l2_l3_min) && Number.isFinite(dp.u_l3_l1_min)) {
                    return (dp.u_l1_l2_min + dp.u_l2_l3_min + dp.u_l3_l1_min) / 3;
                }
                return Number.isFinite(dp.u_l1_l2) && Number.isFinite(dp.u_l2_l3) && Number.isFinite(dp.u_l3_l1)
                    ? (dp.u_l1_l2 + dp.u_l2_l3 + dp.u_l3_l1) / 3
                    : null;
            }));
            const netzMaxRange = numberRange(data.datapoints.map(dp => {
                if (Number.isFinite(dp.u_l1_l2_max) && Number.isFinite(dp.u_l2_l3_max) && Number.isFinite(dp.u_l3_l1_max)) {
                    return (dp.u_l1_l2_max + dp.u_l2_l3_max + dp.u_l3_l1_max) / 3;
                }
                return Number.isFinite(dp.u_l1_l2) && Number.isFinite(dp.u_l2_l3) && Number.isFinite(dp.u_l3_l1)
                    ? (dp.u_l1_l2 + dp.u_l2_l3 + dp.u_l3_l1) / 3
                    : null;
            }));
            const netzCombined = (netzMinRange && netzMaxRange)
                ? { min: netzMinRange.min, max: netzMaxRange.max }
                : netzMinRange || netzMaxRange;

            const vmaxText = collector && collector.u_voltage_max
                ? ` | Vmax ${collector.u_voltage_max.value.toFixed(1)} V @ ${formatTs(collector.u_voltage_max.ts)}`
                : '';
            infoEl.textContent =
                `Netz ${fmtRange(netzCombined, 1)} V | ` +
                `f ${fmtRange(freqRange, 3)} Hz` +
                vmaxText;
        }

        function updatePeriodButtons() {
            document.getElementById('btnPeriodTag').classList.toggle('active', currentPeriod === 'tag');
            document.getElementById('btnPeriodMonat').classList.toggle('active', currentPeriod === 'monat');
            document.getElementById('btnPeriodJahr').classList.toggle('active', currentPeriod === 'jahr');
            document.getElementById('btnPeriodGesamt').classList.toggle('active', currentPeriod === 'gesamt');
        }

        function updateAnalysisButtonState() {
            const btn = document.getElementById('btnAnalyse');
            const enabled = currentPeriod === 'tag';
            btn.disabled = !enabled;
            btn.style.opacity = enabled ? '1' : '0.45';
            btn.classList.toggle('active', enabled && showAnalysis);
        }

        function setPeriod(period) {
            if (period === currentPeriod) return;
            currentPeriod = period;
            currentDate = normalizeDateForPeriod(currentDate, currentPeriod);
            if (currentPeriod !== 'tag') {
                showAnalysis = false;
                analysisData = null;
            }
            updatePeriodButtons();
            updateAnalysisButtonState();
            updateDateDisplay();
            loadData();
        }

        function toggleAnalysis() {
            if (currentPeriod !== 'tag') return;
            showAnalysis = !showAnalysis;
            updateAnalysisButtonState();
            if (showAnalysis) {
                loadData();
            } else if (currentData && currentDateStr) {
                renderChart(currentData, currentDateStr);
            }
        }

        function updateDateDisplay() {
            const el = document.getElementById('dateDisplay');
            const navPrev = document.getElementById('navPrev');
            const navNext = document.getElementById('navNext');
            const today = new Date();

            if (currentPeriod === 'gesamt') {
                el.textContent = 'Gesamt';
                navPrev.disabled = true;
                navNext.disabled = true;
                return;
            }

            navPrev.disabled = false;
            if (currentPeriod === 'tag') {
                const isToday = formatDateISO(currentDate) === formatDateISO(today);
                el.textContent = isToday
                    ? 'Heute'
                    : currentDate.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
            } else if (currentPeriod === 'monat') {
                el.textContent = currentDate.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
            } else {
                el.textContent = String(currentDate.getFullYear());
            }

            if (currentMeta && typeof currentMeta.has_next === 'boolean') {
                navNext.disabled = !currentMeta.has_next;
            } else if (currentPeriod === 'tag') {
                navNext.disabled = formatDateISO(currentDate) >= formatDateISO(today);
            } else if (currentPeriod === 'monat') {
                navNext.disabled = (currentDate.getFullYear() > today.getFullYear()) ||
                    (currentDate.getFullYear() === today.getFullYear() && currentDate.getMonth() >= today.getMonth());
            } else {
                navNext.disabled = currentDate.getFullYear() >= today.getFullYear();
            }
        }

        function navigateStep(offset) {
            if (currentPeriod === 'gesamt') return;
            shiftDateByPeriod(offset);
            updateDateDisplay();
            loadData();
        }

        function navigateToToday() {
            if (currentPeriod === 'gesamt') return;
            currentDate = normalizeDateForPeriod(new Date(), currentPeriod);
            updateDateDisplay();
            loadData();
        }

        function getBoundsFromData(data, dateStr) {
            if (data.window_start_ts && data.window_end_ts) {
                return {
                    min: data.window_start_ts * 1000,
                    max: data.window_end_ts * 1000,
                };
            }
            if (data.datapoints && data.datapoints.length > 0) {
                return {
                    min: data.datapoints[0].ts * 1000,
                    max: data.datapoints[data.datapoints.length - 1].ts * 1000,
                };
            }
            const d = new Date(dateStr + 'T00:00:00');
            return { min: d.getTime(), max: d.getTime() + 24 * 3600 * 1000 };
        }

        async function loadData() {
            const dateStr = formatDateISO(currentDate);
            const statusEl = document.getElementById('statusInfo');
            statusEl.textContent = 'Lädt...';
            document.getElementById('loadingMain').style.display = 'block';

            try {
                const resp = await fetch(`/api/netzqualitaet/zeitraum?period=${currentPeriod}&date=${dateStr}`);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();

                const respMax = await fetch(`/api/netzqualitaet/maxima?period=${currentPeriod}&date=${dateStr}`);
                maximaData = respMax.ok ? await respMax.json() : null;

                if (showAnalysis && currentPeriod === 'tag') {
                    const respA = await fetch(`/api/netzqualitaet/analyse?date=${dateStr}`);
                    analysisData = respA.ok ? await respA.json() : null;
                } else {
                    analysisData = null;
                }

                document.getElementById('loadingMain').style.display = 'none';
                currentData = data;
                currentMeta = data;
                currentDateStr = dateStr;
                updateDateDisplay();
                renderChart(data, dateStr);

                let status = `${data.datapoints.length} Punkte · ${data.source}`;
                if (analysisData && analysisData.summary) {
                    const s = analysisData.summary;
                    status += ` · DFD Ø${Math.round(s.dfd_mean)} mHz (max ${Math.round(s.dfd_max)})`;
                    if (s.local_events > 0) {
                        status += ` · ${s.local_events} lokale Events`;
                    }
                }
                if (maximaData && maximaData.available && maximaData.maxima && maximaData.maxima.u_voltage_max) {
                    const acc = maximaData.maxima.accuracy ? ` (${maximaData.maxima.accuracy})` : '';
                    status += ` · Vmax ${maximaData.maxima.u_voltage_max.value.toFixed(1)}V${acc}`;
                }
                statusEl.textContent = status;
            } catch (err) {
                console.error('Netzqualität Fehler:', err);
                statusEl.textContent = 'Fehler: ' + err.message;
                document.getElementById('loadingMain').textContent = 'Fehler beim Laden';
            }
        }

        function buildAnalysisOverlay() {
            // 15-min Raster: vertikale Linien, farbcodiert nach Grenztyp
            // + DFD-Event-Marker auf der Frequenzkurve
            const markLines = [];
            const markPoints = [];
            if (!analysisData || !analysisData.available || !analysisData.boundaries) return { markLines, markPoints };

            analysisData.boundaries.forEach(b => {
                const t = b.boundary_ts * 1000;
                // Rasterlinien nach Typ
                let color, width, dashType;
                if (b.boundary_type === 'full_hour') {
                    color = 'rgba(255,255,255,0.18)'; width = 1.2; dashType = 'solid';
                } else if (b.boundary_type === 'half_hour') {
                    color = 'rgba(255,255,255,0.09)'; width = 0.8; dashType = [4, 4];
                } else {
                    color = 'rgba(255,255,255,0.04)'; width = 0.5; dashType = [2, 4];
                }
                markLines.push({
                    xAxis: t,
                    lineStyle: { color, width, type: dashType }
                });

                // DFD-Event-Marker (>60 mHz)
                if (b.dfd_mHz >= 60) {
                    const isLocal = b.local_impact >= 0.1;
                    markPoints.push({
                        coord: [t, b.f_nadir],
                        symbol: 'triangle',
                        symbolSize: Math.min(6 + b.dfd_mHz / 20, 14),
                        itemStyle: {
                            color: isLocal ? '#facc15' : '#ef4444',
                            borderColor: isLocal ? '#a16207' : '#991b1b',
                            borderWidth: 1
                        },
                        name: `DFD ${b.dfd_mHz} mHz ${b.boundary_type.replace('_', ' ')}${isLocal ? ' (lokal)' : ''}`
                    });
                }
            });
            return { markLines, markPoints };
        }

        function renderChart(data, dateStr) {
            const dom = document.getElementById('mainChart');
            if (mainChart) mainChart.dispose();
            mainChart = echarts.init(dom);
            updateMinMaxInfo(data);

            const bounds = getBoundsFromData(data, dateStr);
            const tsL1L2 = [], tsL2L3 = [], tsL3L1 = [], tsFreq = [], tsNetz = [];
            const pointMeta = new Map();

            data.datapoints.forEach(dp => {
                const t = dp.ts * 1000;
                pointMeta.set(t, dp);
                if (dp.u_l1_l2 != null) tsL1L2.push([t, dp.u_l1_l2]);
                if (dp.u_l2_l3 != null) tsL2L3.push([t, dp.u_l2_l3]);
                if (dp.u_l3_l1 != null) tsL3L1.push([t, dp.u_l3_l1]);
                if (dp.f_netz != null) tsFreq.push([t, dp.f_netz]);
                // Gemittelte Netzspannung: eliminiert lokale Lasteffekte (ΣΔI=0)
                if (dp.u_l1_l2 != null && dp.u_l2_l3 != null && dp.u_l3_l1 != null) {
                    const avg = (dp.u_l1_l2 + dp.u_l2_l3 + dp.u_l3_l1) / 3;
                    tsNetz.push([t, Math.round(avg * 10) / 10]);
                }
            });

            const overlay = (showAnalysis && currentPeriod === 'tag')
                ? buildAnalysisOverlay()
                : { markLines: [], markPoints: [] };

            // Helper: Zeit formatieren (Tag/Monat/Jahr-abhaengig)
            const fmtMarkerTime = (tsMs) => {
                const d = new Date(tsMs);
                if (currentPeriod === 'tag') {
                    return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }
                if (currentPeriod === 'monat') {
                    return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                }
                return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
            };

            const mxNode = maximaData && maximaData.available && maximaData.maxima ? maximaData.maxima : null;

            const buildVoltagePoint = (entry, kind) => {
                if (!entry) return null;
                const isMax = kind === 'max';
                return {
                    coord: [entry.ts * 1000, entry.value],
                    symbol: isMax ? 'diamond' : 'triangle',
                    symbolSize: 12,
                    symbolRotate: isMax ? 0 : 180,
                    itemStyle: isMax
                        ? { color: '#f43f5e', borderColor: '#881337', borderWidth: 1 }
                        : { color: '#38bdf8', borderColor: '#075985', borderWidth: 1 },
                    label: {
                        show: true,
                        formatter: isMax ? 'Vmax' : 'Vmin',
                        color: isMax ? '#fecdd3' : '#bae6fd',
                        fontSize: 10,
                        position: isMax ? 'top' : 'bottom'
                    },
                    name: `${isMax ? 'Vmax' : 'Vmin'}: ${entry.value.toFixed(1)} V<br/>${fmtMarkerTime(entry.ts * 1000)}`,
                };
            };

            const buildFreqPoint = (entry, kind) => {
                if (!entry) return null;
                const isMax = kind === 'max';
                return {
                    coord: [entry.ts * 1000, entry.value],
                    symbol: 'pin',
                    symbolSize: 14,
                    symbolRotate: isMax ? 0 : 180,
                    itemStyle: isMax
                        ? { color: '#f59e0b', borderColor: '#92400e', borderWidth: 1 }
                        : { color: '#a78bfa', borderColor: '#5b21b6', borderWidth: 1 },
                    label: {
                        show: true,
                        formatter: isMax ? 'f max' : 'f min',
                        color: isMax ? '#fde68a' : '#ddd6fe',
                        fontSize: 9,
                        position: isMax ? 'top' : 'bottom'
                    },
                    name: `${isMax ? 'f max' : 'f min'}: ${entry.value.toFixed(3)} Hz<br/>${fmtMarkerTime(entry.ts * 1000)}`,
                };
            };

            const voltageMarkPoints = [
                buildVoltagePoint(mxNode ? mxNode.u_voltage_max : null, 'max'),
                buildVoltagePoint(mxNode ? mxNode.u_voltage_min : null, 'min'),
            ].filter(Boolean);

            const freqExtremes = [
                buildFreqPoint(mxNode ? mxNode.f_netz_max : null, 'max'),
                buildFreqPoint(mxNode ? mxNode.f_netz_min : null, 'min'),
            ].filter(Boolean);

            const freqMarkPoints = [
                ...(overlay.markPoints || []),
                ...freqExtremes
            ];

            const seriesBase = {
                type: 'line', smooth: true, symbol: 'none',
                lineStyle: { width: 1.5 }
            };

            // Frequenz-Serie mit Analyse-Markern
            const freqSeries = {
                ...seriesBase, name: 'Frequenz', data: tsFreq, yAxisIndex: 1,
                itemStyle: { color: '#e8915a' }, lineStyle: { width: 1.5, type: 'solid' },
                markLine: overlay.markLines.length > 0 ? {
                    silent: true,
                    symbol: 'none',
                    label: { show: false },
                    data: overlay.markLines
                } : undefined,
                markPoint: freqMarkPoints.length > 0 ? {
                    data: freqMarkPoints,
                    label: { show: true },
                    tooltip: {
                        trigger: 'item',
                        formatter: p => (p.data && p.data.name) ? p.data.name : (p.name || '')
                    }
                } : undefined
            };

            const voltageSeries = viewMode === 'lokal'
                ? [
                    {
                        ...seriesBase,
                        name: 'L1-L2',
                        data: tsL1L2,
                        yAxisIndex: 0,
                        itemStyle: { color: '#4646FF' },
                        markPoint: voltageMarkPoints.length > 0 ? {
                            data: voltageMarkPoints,
                            label: { show: true },
                            tooltip: {
                                trigger: 'item',
                                formatter: p => (p.data && p.data.name) ? p.data.name : (p.name || '')
                            }
                        } : undefined
                    },
                    { ...seriesBase, name: 'L2-L3', data: tsL2L3, yAxisIndex: 0, itemStyle: { color: '#6E6EFF' } },
                    { ...seriesBase, name: 'L3-L1', data: tsL3L1, yAxisIndex: 0, itemStyle: { color: '#8C8CFF' } }
                ]
                : [
                    {
                        ...seriesBase,
                        name: 'Netzspannung',
                        data: tsNetz,
                        yAxisIndex: 0,
                        itemStyle: { color: '#22d3ee' },
                        lineStyle: { width: 2 },
                        markPoint: voltageMarkPoints.length > 0 ? {
                            data: voltageMarkPoints,
                            label: { show: true },
                            tooltip: {
                                trigger: 'item',
                                formatter: p => (p.data && p.data.name) ? p.data.name : (p.name || '')
                            }
                        } : undefined
                    }
                ];

            mainChart.setOption({
                grid: { left: 55, right: 55, top: 40, bottom: 66 },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross', snap: false },
                    formatter: params => {
                        const t = new Date(params[0].value[0]);
                        let time;
                        if (currentPeriod === 'tag' || currentPeriod === 'monat') {
                            time = t.toLocaleString('de-DE', {
                                day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                            });
                        } else {
                            time = t.toLocaleDateString('de-DE', {
                                month: '2-digit', year: 'numeric'
                            });
                        }
                        let lines = [`<b>${time}</b>`];
                        params.forEach(p => {
                            if (p.seriesName === 'Frequenz') {
                                lines.push(`${p.marker} ${p.seriesName}: ${p.value[1].toFixed(3)} Hz`);
                            } else {
                                lines.push(`${p.marker} ${p.seriesName}: ${p.value[1].toFixed(1)} V`);
                            }
                        });

                        const dp = pointMeta.get(params[0].value[0]);
                        if (dp) {
                            if (viewMode === 'lokal') {
                                if (Number.isFinite(dp.u_l1_l2_min) && Number.isFinite(dp.u_l1_l2_max)) {
                                    lines.push(`Min/Max L1-L2: ${dp.u_l1_l2_min.toFixed(1)} / ${dp.u_l1_l2_max.toFixed(1)} V`);
                                }
                                if (Number.isFinite(dp.u_l2_l3_min) && Number.isFinite(dp.u_l2_l3_max)) {
                                    lines.push(`Min/Max L2-L3: ${dp.u_l2_l3_min.toFixed(1)} / ${dp.u_l2_l3_max.toFixed(1)} V`);
                                }
                                if (Number.isFinite(dp.u_l3_l1_min) && Number.isFinite(dp.u_l3_l1_max)) {
                                    lines.push(`Min/Max L3-L1: ${dp.u_l3_l1_min.toFixed(1)} / ${dp.u_l3_l1_max.toFixed(1)} V`);
                                }
                            } else if (
                                Number.isFinite(dp.u_l1_l2_min) && Number.isFinite(dp.u_l2_l3_min) && Number.isFinite(dp.u_l3_l1_min) &&
                                Number.isFinite(dp.u_l1_l2_max) && Number.isFinite(dp.u_l2_l3_max) && Number.isFinite(dp.u_l3_l1_max)
                            ) {
                                const netzMin = (dp.u_l1_l2_min + dp.u_l2_l3_min + dp.u_l3_l1_min) / 3;
                                const netzMax = (dp.u_l1_l2_max + dp.u_l2_l3_max + dp.u_l3_l1_max) / 3;
                                lines.push(`Min/Max Netz: ${netzMin.toFixed(1)} / ${netzMax.toFixed(1)} V`);
                            }

                            if (Number.isFinite(dp.f_netz_min) && Number.isFinite(dp.f_netz_max)) {
                                lines.push(`Min/Max f: ${dp.f_netz_min.toFixed(3)} / ${dp.f_netz_max.toFixed(3)} Hz`);
                            }
                        }

                        return lines.join('<br>');
                    }
                },
                legend: {
                    data: viewMode === 'lokal'
                        ? ['L1-L2', 'L2-L3', 'L3-L1', 'Frequenz']
                        : ['Netzspannung', 'Frequenz'],
                    textStyle: { color: '#94a3b8', fontSize: 11 },
                    top: 4, right: 60
                },
                xAxis: {
                    type: 'time', min: bounds.min, max: bounds.max,
                    axisPointer: { show: true, label: { show: true } },
                    axisLabel: { color: '#64748b', fontSize: 10,
                        formatter: v => {
                            const t = new Date(v);
                            if (currentPeriod === 'tag') {
                                return t.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                            }
                            if (currentPeriod === 'monat') {
                                return t.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
                            }
                            if (currentPeriod === 'jahr') {
                                return t.toLocaleDateString('de-DE', { month: '2-digit' });
                            }
                            return t.toLocaleDateString('de-DE', { month: '2-digit', year: '2-digit' });
                        }
                    },
                    splitLine: { show: false }
                },
                yAxis: [
                    {
                        type: 'value',
                        name: 'V',
                        min: 360, max: 440,
                        axisPointer: { show: true, label: { show: true } },
                        nameTextStyle: { color: '#64748b', fontSize: 10 },
                        axisLabel: { color: '#64748b', fontSize: 10 },
                        splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } }
                    },
                    {
                        type: 'value',
                        name: 'Hz',
                        min: 48, max: 52,
                        axisPointer: { show: true, label: { show: true } },
                        nameTextStyle: { color: '#e8915a', fontSize: 10 },
                        axisLabel: { color: '#e8915a', fontSize: 10,
                            formatter: v => v.toFixed(1)
                        },
                        splitLine: { show: false }
                    }
                ],
                dataZoom: [
                    {
                        type: 'inside',
                        throttle: 30,
                        zoomOnMouseWheel: true,
                        moveOnMouseMove: true,
                        moveOnMouseWheel: true
                    },
                    {
                        type: 'slider',
                        height: 16,
                        bottom: 14,
                        borderColor: 'rgba(255,255,255,0.1)',
                        backgroundColor: 'rgba(15,23,42,0.45)',
                        fillerColor: 'rgba(70,70,255,0.25)',
                        handleSize: 14,
                    }
                ],
                series: [...voltageSeries, freqSeries]
            });
        }

        // Resize
        window.addEventListener('resize', () => {
            if (mainChart) mainChart.resize();
        });

        // Init
        currentDate = normalizeDateForPeriod(currentDate, currentPeriod);
        updatePeriodButtons();
        updateAnalysisButtonState();
        updateDateDisplay();
        loadData();
    </script>
</body>
</html>
