<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v={{ favicon_version }}">
    <title>Energievergleich PAC4200 ↔ SM - PV-System</title>
    <script src="/static/js/nav-context.js"></script>
    <script src="/static/js/nav-ui.js"></script>
    <link rel="stylesheet" href="/static/css/nav-ui.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a; color: #e2e8f0;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        .top-nav {
            display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
            padding: 8px 16px; background: rgba(15,23,42,0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
        }
        .nav-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.8); letter-spacing: .3px; }
        .content { flex: 1; overflow-y: auto; padding: 16px 16px 48px; max-width: 1240px; margin: 0 auto; width: 100%; }
        .globalbar {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            background: rgba(30,41,59,0.6); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; padding: 10px 14px; margin-bottom: 20px;
        }
        .gb-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .4px; }
        .ctrl-btn {
            font-size: 12px; padding: 5px 12px; border-radius: 5px; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.7); transition: all .15s;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .ctrl-btn.active { background: rgba(99,102,241,0.25); color: #a5b4fc; border-color: rgba(99,102,241,0.5); }

        .section {
            margin-bottom: 26px; background: rgba(30,41,59,0.5);
            border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; overflow: hidden;
        }
        .section-body { padding: 16px 20px 20px; }

        table.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
        table.cmp th, table.cmp td { padding: 7px 9px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.06); }
        table.cmp th { color: #94a3b8; font-weight: 600; text-align: right; position: sticky; top: 0; background: #1a2437; }
        table.cmp td:first-child, table.cmp th:first-child { text-align: left; }
        table.cmp tbody tr:hover { background: rgba(255,255,255,0.03); }
        .loading-msg { text-align: center; padding: 26px; color: #64748b; font-size: 13px; }
        .table-scroll { max-height: 660px; overflow-y: auto; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); }
        .sec-title { font-size: 12px; color: #94a3b8; margin-bottom: 10px; font-weight: 600; }
        .cov { font-size: 10.5px; color: #64748b; }
        table.cmp td.ref { color: #64748b; font-style: italic; }
        table.cmp td.warn { color: #fbbf24; }
        table.cmp td.bad { color: #f87171; font-weight: 600; }
        .gb-sub { display: flex; align-items: center; gap: 10px; margin-left: 14px; padding-left: 14px; border-left: 1px solid rgba(255,255,255,0.12); }
    </style>
</head>
<body>

<nav class="top-nav">
    <span class="nav-title">NQ · Energievergleich PAC4200 ↔ Fronius-SM</span>
</nav>

<div class="content">
    <div class="globalbar">
        <span class="gb-label">Aggregation</span>
        <button class="ctrl-btn agg-btn active" onclick="setAgg('day',this)">Tag</button>
        <button class="ctrl-btn agg-btn" onclick="setAgg('month',this)">Monat</button>
        <button class="ctrl-btn agg-btn" onclick="setAgg('year',this)">Jahr</button>
        <button class="ctrl-btn agg-btn" onclick="setAgg('ims',this)">iMSys</button>
        <span class="gb-sub" id="daysBar">
            <span class="gb-label">Zeitraum</span>
            <button class="ctrl-btn days-btn" onclick="setDays(30,this)">30 T</button>
            <button class="ctrl-btn days-btn active" onclick="setDays(90,this)">90 T</button>
            <button class="ctrl-btn days-btn" onclick="setDays(0,this)">Alle</button>
        </span>
        <button class="ctrl-btn" style="margin-left:auto" onclick="load()">↻ Aktualisieren</button>
    </div>

    <div id="view"><div class="loading-msg">Lade…</div></div>
</div>

<script>
const S = { agg: 'day', days: 90 };
const $ = id => document.getElementById(id);

function markActive(sel, btn){ document.querySelectorAll(sel).forEach(x=>x.classList.remove('active')); btn.classList.add('active'); }
function setAgg(a, btn){ S.agg=a; markActive('.agg-btn', btn); $('daysBar').style.display=(a==='day')?'flex':'none'; load(); }
function setDays(d, btn){ S.days=d; markActive('.days-btn', btn); load(); }

function num(v,dec){ return (v===null||v===undefined)?'—':Number(v).toFixed(dec===undefined?3:dec); }
function pct(v){ if(v===null||v===undefined) return '<td>—</td>'; const a=Math.abs(v); const cls=a>15?'bad':a>5?'warn':''; return `<td class="${cls}">${num(v,1)} %</td>`; }
function section(title, inner){ return `<div class="section"><div class="section-body">${title?`<div class="sec-title">${title}</div>`:''}<div class="table-scroll">${inner}</div></div></div>`; }
async function fetchJson(url){ const r = await fetch(url); return r.json(); }

async function load(){
    $('view').innerHTML = '<div class="loading-msg">Lade…</div>';
    try {
        if (S.agg === 'ims')   return renderIms(await fetchJson('/api/nq/energy_compare?agg=ims'));
        if (S.agg === 'month') return renderPeriod(await fetchJson('/api/nq/energy_compare?agg=month'), 'Monat');
        if (S.agg === 'year')  return renderPeriod(await fetchJson('/api/nq/energy_compare?agg=year'), 'Jahr');
        renderPeriod(await fetchJson(`/api/nq/energy_compare?days=${S.days}&all=${S.days===0?1:0}`), 'Tag');
    } catch(e){ $('view').innerHTML = '<div class="loading-msg">Fehler beim Laden.</div>'; }
}

function renderPeriod(d, label){
    const it = d.items || [];
    if (!it.length){ $('view').innerHTML = section(d.from||'', '<div class="loading-msg">Keine PAC-Zählertage.</div>'); return; }
    const rows = it.slice().reverse().map(i=>{
        const cov = (label!=='Tag' && i.n_cmp!=null && i.n_days!=null) ? ` <span class="cov">${i.n_cmp}/${i.n_days} T</span>` : '';
        return `<tr>
            <td>${i.label}${cov}</td>
            <td>${num(i.pac_imp_kwh)}</td><td>${num(i.sm_imp_kwh)}</td><td>${num(i.d_imp_kwh)}</td>${pct(i.d_imp_pct)}
            <td>${num(i.pac_exp_kwh)}</td><td>${num(i.sm_exp_kwh)}</td><td>${num(i.d_exp_kwh)}</td>${pct(i.d_exp_pct)}
        </tr>`;
    }).join('');
    const tbl = `<table class="cmp"><thead><tr>
        <th>${label}</th><th>PAC Imp</th><th>SM Imp</th><th>Δ Imp</th><th>Δ %</th>
        <th>PAC Exp</th><th>SM Exp</th><th>Δ Exp</th><th>Δ %</th></tr></thead><tbody>${rows}</tbody></table>`;
    $('view').innerHTML = section(d.from||'', tbl);
}

function renderIms(d){
    const rd = d.readings || [], iv = d.intervals || [];
    const rrows = rd.slice().reverse().map(r=>`<tr>
        <td>${r.day}</td><td>${num(r.imp_kwh,0)}</td><td>${num(r.exp_kwh,0)}</td>
        <td style="text-align:left">${r.source||'—'}</td><td style="text-align:left">${r.note||''}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="loading-msg">Keine iMSys-Ablesungen.</td></tr>';
    const tblR = `<table class="cmp"><thead><tr><th>Ablesung</th><th>Import kWh</th><th>Export kWh</th>
        <th style="text-align:left">Quelle</th><th style="text-align:left">Notiz</th></tr></thead><tbody>${rrows}</tbody></table>`;

    let irows = '';
    iv.slice().reverse().forEach(v=>{
        irows += `<tr>
            <td rowspan="3" style="text-align:left">${v.from} →<br>${v.to}<br><span class="cov">${v.n_pac}/${v.n_days} T PAC · ${v.n_sm} T SM</span></td>
            <td>iMSys</td><td>${num(v.ims_imp_kwh)}</td><td>${num(v.ims_exp_kwh)}</td><td class="ref">Referenz</td><td class="ref">Referenz</td></tr>
            <tr><td>SM</td><td>${num(v.sm_imp_kwh)}</td><td>${num(v.sm_exp_kwh)}</td>${pct(v.d_sm_imp_pct)}${pct(v.d_sm_exp_pct)}</tr>
            <tr><td>PAC</td><td>${num(v.pac_imp_kwh)}</td><td>${num(v.pac_exp_kwh)}</td>${pct(v.d_pac_imp_pct)}${pct(v.d_pac_exp_pct)}</tr>`;
    });
    if (!iv.length) irows = '<tr><td colspan="6" class="loading-msg">Mind. zwei iMSys-Ablesungen nötig.</td></tr>';
    const tblI = `<table class="cmp"><thead><tr><th>Intervall</th><th>System</th><th>Δ Import</th><th>Δ Export</th>
        <th>Abw. Imp vs iMSys</th><th>Abw. Exp vs iMSys</th></tr></thead><tbody>${irows}</tbody></table>`;

    $('view').innerHTML = section('iMSys-Ablesungen (eichrechtliche Referenz)', tblR)
        + section('Intervall-Vergleich · Deltas zwischen Ablesungen (PAC/SM auf Tagesgrenzen genähert)', tblI);
}

if (window.PVNavUI) PVNavUI.initDrawer();
load();
</script>
</body>
</html>
